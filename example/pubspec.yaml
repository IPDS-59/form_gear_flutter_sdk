name: example
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 0.3.0

environment:
  sdk: ">=3.10.3 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  # HTTP Inspector (Alice) for debugging network requests
  alice: ^1.0.0
  alice_dio: ^1.0.7
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  envied: ^1.3.2

  # File picker
  file_picker: ^10.3.7
  flutter:
    sdk: flutter

  # BLoC for state management in demo screens
  flutter_bloc: ^9.1.1

  # SVG support
  flutter_svg: ^2.2.3

  # FormGear SDK
  form_gear_engine_sdk:
    path: ../

  # Location services
  geolocator: ^14.0.2

  # Image and camera
  image_picker: ^1.2.1

  # Path provider for file storage
  path_provider: ^2.1.5

  # Permission handling
  permission_handler: ^12.0.1

  # Audio recording
  record: ^6.1.2

  # Skeleton loading animations
  skeletonizer: ^2.1.1

dev_dependencies:
  build_runner: ^2.10.4
  envied_generator: ^1.3.2

  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # Assets for FormGear
  # Explicitly list all asset files to ensure they're included in release builds
  assets:
    # Form engine assets - Engine 1 (FormGear)
    - assets/formengine/1/index.html
    - assets/formengine/1/form-gear.es.js
    - assets/formengine/1/form-gear.umd.js
    - assets/formengine/1/style.css
    - assets/formengine/1/version.json
    # Form engine assets - Engine 2 (FasihForm)
    - assets/formengine/2/index.html
    - assets/formengine/2/fasih-form.es.js
    - assets/formengine/2/fasih-form.umd.js
    - assets/formengine/2/style.css
    - assets/formengine/2/version.json
    # FormGear default data files
    - assets/formgear/reference.json
    - assets/formgear/media.json
    - assets/formgear/response.json
    # Demo template files
    - assets/Template/demo/demo_template.json
    - assets/Template/demo/demo_validation.json
    - assets/Template/demo/demo_reference.json
    - assets/Template/demo/demo_response.json
    - assets/Template/demo/demo_media.json
    - assets/Template/demo/demo_preset.json
    - assets/Template/demo/demo_remark.json
